  <rect x="24" y="24" width="464" height="464" rx="112" fill="url(#bg)" stroke="url(#border)" stroke-width="16" />
  <circle cx="395" cy="115" r="16" fill="#00f5ff" opacity="0.9" />
  <text x="256" y="320" font-family="system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif" font-weight="800" font-size="210" fill="url(#cyanGlow)" text-anchor="middle" letter-spacing="-6" filter="url(#glow)">SD</text>
</svg>